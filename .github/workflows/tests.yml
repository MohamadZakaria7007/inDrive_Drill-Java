name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest   # Chrome is preinstalled; Selenium Manager fetches the driver
    timeout-minutes: 20
    env:
      UI_BASE_URL: ${{ vars.UI_BASE_URL || 'https://practicesoftwaretesting.com' }}
      UI_USERNAME: ${{ secrets.UI_USERNAME }}
      UI_PASSWORD: ${{ secrets.UI_PASSWORD }}
      TEST_ID_ATTRIBUTE: ${{ vars.TEST_ID_ATTRIBUTE || 'data-test' }}
      HEADLESS: "true"
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.practicesoftwaretesting.com' }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # API tests only: the shop's web host is behind Cloudflare bot protection, which serves
      # GitHub-hosted runners a "Verify you are human" page instead of the app, so UI tests
      # cannot run here. They run locally (mvn -B test -Dgroups=ui). See README > CI.
      - name: API smoke (fail fast)
        run: mvn -B test "-Dgroups=api & smoke"

      - name: API regression
        run: mvn -B test -Dgroups=api

      - name: Upload reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            target/surefire-reports/
            target/failures/
          retention-days: 7
