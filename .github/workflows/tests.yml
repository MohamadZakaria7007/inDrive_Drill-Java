name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest   # Chrome is preinstalled; Selenium Manager fetches the driver
    timeout-minutes: 20
    env:
      UI_BASE_URL: ${{ vars.UI_BASE_URL }}
      UI_USERNAME: ${{ secrets.UI_USERNAME }}
      UI_PASSWORD: ${{ secrets.UI_PASSWORD }}
      TEST_ID_ATTRIBUTE: ${{ vars.TEST_ID_ATTRIBUTE }}
      HEADLESS: "true"
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Smoke (fail fast)
        run: mvn -B test -Dgroups=smoke

      - name: Full regression
        run: mvn -B test

      - name: Upload reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            target/surefire-reports/
            target/failures/
          retention-days: 7
